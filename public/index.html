<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOCO - Voice to Academic Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .glass {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4"
  >
    <div
      class="w-full max-w-2xl bg-white border border-slate-100 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.05)] overflow-hidden"
    >
      <div class="pt-10 pb-6 px-8 text-center">
        <div
          class="inline-block px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-semibold tracking-wider uppercase mb-3"
        >
          Academic Assistant
        </div>
        <h1 class="text-4xl font-extrabold tracking-tight text-slate-900">
          VOCO<span class="text-indigo-600">.</span>
        </h1>
        <p class="mt-2 text-slate-500 font-medium">
          Ubah rekaman suara menjadi teks akademik profesional.
        </p>
      </div>

      <div class="p-8 pt-2">
        <div class="relative group">
          <textarea
            id="rawText"
            class="w-full p-5 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-indigo-500/20 focus:bg-white transition-all duration-300 outline-none resize-none text-slate-700 placeholder:text-slate-400"
            rows="4"
            placeholder="Teks hasil suara akan muncul di sini..."
          ></textarea>
          <div class="absolute bottom-4 right-4 flex gap-2">
            <button
              id="recordBtn"
              class="p-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-lg shadow-indigo-200 transition-all active:scale-95 group"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
                />
              </svg>
            </button>
            <button
              id="stopBtn"
              class="p-3 bg-rose-500 hover:bg-rose-600 text-white rounded-full shadow-lg shadow-rose-200 transition-all active:scale-95"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <rect width="12" height="12" x="6" y="6" rx="2" />
              </svg>
            </button>
          </div>
        </div>

        <div class="flex items-center my-8">
          <div class="flex-grow h-[1px] bg-slate-100"></div>
          <button
            id="generateBtn"
            class="mx-4 px-8 py-3 bg-slate-900 hover:bg-indigo-600 text-white rounded-full font-semibold transition-all duration-300 transform hover:-translate-y-1 shadow-xl shadow-slate-200 flex items-center gap-2"
          >
            <span>Parafrase With AI✨</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"
              />
            </svg>
          </button>
          <div class="flex-grow h-[1px] bg-slate-100"></div>
        </div>

        <div class="space-y-4">
          <textarea
            id="resultText"
            class="w-full p-5 bg-indigo-50/30 border-2 border-dashed border-indigo-100 rounded-2xl focus:border-indigo-300 focus:bg-white transition-all duration-300 outline-none resize-none text-slate-800 font-medium"
            rows="5"
            placeholder="Hasil parafrase AI akan tampil di sini..."
          ></textarea>

          <div class="flex gap-3">
            <button
              id="copyBtn"
              class="flex-1 py-3 border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold rounded-xl transition-all flex justify-center items-center gap-2"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-4 w-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"
                />
              </svg>
              Salin
            </button>
            <button
              id="clearBtn"
              class="px-6 py-3 text-slate-400 hover:text-rose-500 font-medium transition-colors"
            >
              Bersihkan
            </button>
          </div>
        </div>
      </div>

      <div class="bg-slate-50 p-4 text-center border-t border-slate-100">
        <p class="text-xs text-slate-400">
          Powered by AI Gemini • v1.0 Application Version
        </p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
